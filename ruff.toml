line-length = 200
target-version = "py313"

[lint]
select = ["E", "F", "W"]
ignore = [
    "E741",  # ambiguous variable name (e.g. `l` for angular momentum)
    "E743",  # ambiguous function name (e.g. `I` for integrals)
    "F403",  # star imports used in several modules
    "F405",  # names possibly defined from star imports
    "E501",  # line too long - scientific code often has long expressions
]

[lint.per-file-ignores]
"tests/*" = ["F401", "E402"]  # unused imports and late imports common in tests
"src/KSRISax/quad.py" = ["W191"]  # existing tab indentation
